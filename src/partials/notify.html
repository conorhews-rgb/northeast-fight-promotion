<!-- ===================== NOTIFY / CTA ===================== -->
<section class="cta-band" id="notify">
  <div class="wrap narrow mx-auto center">
    <span class="bar bar--center" data-reveal></span>
    <h2 data-reveal>Be first to know</h2>
    <p class="lede mx-auto" data-reveal style="margin-inline:auto">
      Date, venue, full card, tickets. You get one email when there is something real
      to tell you. Nothing else.
    </p>

    <form class="signup mt-3 mx-auto" data-mailto data-subject="NFP announcement list"
          style="justify-content:center" data-reveal>
      <label class="sr-only" for="notify-email">Email address</label>
      <input id="notify-email" type="email" name="email" placeholder="you@email.com" required>
      <button class="btn" type="submit">Notify me</button>
      <div class="form-success" role="status">Nice. Check your mail app to send it.</div>
    </form>
    <p class="form-note" data-reveal>Southern New Hampshire. First show announcement coming soon.</p>
  </div>
</section>
